spring.application.name=flight-service
server.port=8082

spring.datasource.url=jdbc:mysql://localhost:3306/flight_service_db
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.cache.type=redis

spring.kafka.bootstrap-servers=localhost:9092

management.endpoints.web.exposure.include=health,info,prometheus



app.initial-admin.username=${ADMIN_USERNAME:}
app.initial-admin.email=${ADMIN_EMAIL:}
app.initial-admin.password=${ADMIN_PASSWORD:}

app.jwt.public-key=classpath:keys/public-key.pem
app.jwt.private-key=file:${JWT_PRIVATE_KEY_PATH}
app.jwt.expiration-seconds=3600

app.reference-manager.base-url=http://localhost:8081

app.flight-status-scheduler.fixed-delay-ms=30000

spring.cache.redis.time-to-live=10m
spring.cache.redis.cache-null-values=false 

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

app.outbox.kafka-send-timeout=10s
app.outbox.processing-lease=30s

spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JacksonJsonDeserializer

spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.value.default.type=com.alikaracor.learning.flightservice.event.ReferenceEvent
spring.kafka.consumer.properties.spring.json.trusted.packages=com.alikaracor.learning.flightservice.event

management.opentelemetry.tracing.export.otlp.endpoint=${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
management.opentelemetry.tracing.export.otlp.transport=http
management.otlp.metrics.export.enabled=false
management.tracing.sampling.probability=${TRACING_SAMPLING_PROBABILITY:1.0}

management.tracing.propagation.produce=W3C
management.tracing.propagation.consume=W3C,B3,B3_MULTI
management.observations.enable.tasks.scheduled.execution=false

logging.pattern.correlation=[${spring.application.name:},%X{traceId:-},%X{spanId:-}]
logging.include-application-name=false

spring.kafka.template.observation-enabled=true
spring.kafka.listener.observation-enabled=true
