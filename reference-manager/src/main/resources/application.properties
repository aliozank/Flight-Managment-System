spring.application.name=reference-manager

spring.datasource.url=jdbc:mysql://localhost:3306/reference_manager_db
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}



spring.jpa.hibernate.ddl-auto=validate
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

spring.security.oauth2.resourceserver.jwt.public-key-location=classpath:keys/public-key.pem

spring.kafka.bootstrap-servers = localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
